<svg viewBox="0 0 700 1260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow-fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#99ACC2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="1260" fill="#EAF0F6"/>

  <!-- Browser-chrome style header, matching HubSpot's own workflow editor -->
  <rect x="0" y="0" width="700" height="50" fill="#33475B"/>
  <text x="24" y="31" font-size="16" font-weight="700" fill="#FFFFFF">Nurturing et Transfert des Leads B2B</text>
  <path d="M 380 22 l 10 -10 l 6 6 l -10 10 l -7 1 z" fill="none" stroke="#CBD6E2" stroke-width="1.3"/>

  <rect x="0" y="50" width="700" height="40" fill="#FFFFFF"/>
  <line x1="0" y1="90" x2="700" y2="90" stroke="#DFE3EB" stroke-width="1"/>
  <text x="24" y="75" font-size="13" font-weight="700" fill="#33475B">Actions</text>
  <rect x="24" y="82" width="48" height="3" fill="#00A4BD"/>
  <text x="100" y="75" font-size="13" fill="#7C98B6">Paramètres</text>
  <text x="188" y="75" font-size="13" fill="#7C98B6">Performance</text>
  <text x="290" y="75" font-size="13" fill="#7C98B6">Historique</text>
  <rect x="612" y="60" width="64" height="26" rx="3" fill="#EAF0F6" stroke="#CBD6E2" stroke-width="1"/>
  <text x="644" y="77" text-anchor="middle" font-size="12" fill="#7C98B6">Inscrire</text>

  <!-- ============ Trunk: trigger -> score -> delay -> branch ============ -->

  <!-- 0: enrollment marker (grey person icon), no card -->
  <circle cx="350" cy="128" r="17" fill="#7C98B6"/>
  <circle cx="350" cy="122" r="4.5" fill="#FFFFFF"/>
  <path d="M 342,134 Q 350,124 358,134" fill="#FFFFFF"/>
  <line x1="350" y1="145" x2="350" y2="172" stroke="#99ACC2" stroke-width="2"/>

  <!-- Card 1: trigger -->
  <rect x="170" y="172" width="360" height="84" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="350" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#33475B">Déclencheur d'inscription</text>
  <text x="350" y="222" text-anchor="middle" font-size="12.5" fill="#7C98B6">Le contact soumet un formulaire</text>
  <text x="350" y="240" text-anchor="middle" font-size="12.5" fill="#7C98B6">(téléchargement étude de cas OU devis)</text>

  <line x1="350" y1="256" x2="350" y2="288" stroke="#99ACC2" stroke-width="2"/>

  <!-- Icon: set property (teal flag) -->
  <circle cx="350" cy="305" r="17" fill="#00A4BD"/>
  <path d="M 344,296 v 18 M 344,297 h 10 l -3,4 l 3,4 h -10" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="350" y1="322" x2="350" y2="348" stroke="#99ACC2" stroke-width="2"/>

  <!-- Card 2: set lead score -->
  <rect x="170" y="348" width="360" height="84" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="350" y="376" text-anchor="middle" font-size="15" font-weight="700" fill="#33475B">Définir une propriété</text>
  <text x="350" y="398" text-anchor="middle" font-size="12.5" fill="#7C98B6">Score +15 (étude de cas) ou +30 (devis)</text>
  <text x="350" y="416" text-anchor="middle" font-size="12.5" fill="#7C98B6">pondéré selon l'adéquation de l'entreprise</text>

  <line x1="350" y1="432" x2="350" y2="464" stroke="#99ACC2" stroke-width="2"/>

  <!-- Icon: delay (grey clock) -->
  <circle cx="350" cy="481" r="17" fill="#7C98B6"/>
  <circle cx="350" cy="481" r="9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <path d="M 350,475 v 6 h 5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="350" y1="498" x2="350" y2="524" stroke="#99ACC2" stroke-width="2"/>

  <!-- Card 3: delay -->
  <rect x="170" y="524" width="360" height="64" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="350" y="552" text-anchor="middle" font-size="15" font-weight="700" fill="#33475B">Retarder l'action suivante</text>
  <text x="350" y="574" text-anchor="middle" font-size="12.5" fill="#7C98B6">d'1 heure</text>

  <line x1="350" y1="588" x2="350" y2="614" stroke="#99ACC2" stroke-width="2"/>

  <!-- Icon: branch (grey fork) -->
  <circle cx="350" cy="631" r="17" fill="#7C98B6"/>
  <path d="M 350,623 v 6 M 350,629 l -6,6 v 6 M 350,629 l 6,6 v 6" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="350" y1="648" x2="350" y2="674" stroke="#99ACC2" stroke-width="2"/>

  <!-- Card 4: if/then branch -->
  <rect x="170" y="674" width="360" height="84" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="350" y="702" text-anchor="middle" font-size="15" font-weight="700" fill="#33475B">Branche si/alors</text>
  <text x="350" y="724" text-anchor="middle" font-size="12.5" fill="#7C98B6">Le score du lead du contact est</text>
  <text x="350" y="742" text-anchor="middle" font-size="12.5" fill="#7C98B6">supérieur ou égal à 70</text>

  <!-- Split into two branches -->
  <line x1="350" y1="758" x2="350" y2="782" stroke="#99ACC2" stroke-width="2"/>
  <path d="M 350,782 H 175" stroke="#99ACC2" stroke-width="2"/>
  <path d="M 350,782 H 525" stroke="#99ACC2" stroke-width="2"/>
  <line x1="175" y1="782" x2="175" y2="806" stroke="#99ACC2" stroke-width="2" marker-end="url(#arrow-fr)"/>
  <line x1="525" y1="782" x2="525" y2="806" stroke="#99ACC2" stroke-width="2" marker-end="url(#arrow-fr)"/>

  <rect x="140" y="808" width="70" height="24" rx="3" fill="#FBEAEA"/>
  <text x="175" y="824.5" text-anchor="middle" font-size="12" font-weight="700" fill="#C4453F">NON</text>
  <rect x="488" y="808" width="74" height="24" rx="3" fill="#E5F8F0"/>
  <text x="525" y="824.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0F9D58">OUI</text>

  <!-- ============ Left branch (NO): nurture ============ -->
  <line x1="175" y1="832" x2="175" y2="858" stroke="#99ACC2" stroke-width="2"/>

  <circle cx="175" cy="875" r="16" fill="#00A4BD"/>
  <path d="M 169,867 v 16 M 169,868 h 9 l -2.5,4 l 2.5,4 h -9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="175" y1="891" x2="175" y2="915" stroke="#99ACC2" stroke-width="2"/>

  <rect x="20" y="915" width="310" height="84" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="175" y="943" text-anchor="middle" font-size="14" font-weight="700" fill="#33475B">Définir une propriété</text>
  <text x="175" y="964" text-anchor="middle" font-size="12" fill="#7C98B6">Étape de nurturing sur « Actif » —</text>
  <text x="175" y="982" text-anchor="middle" font-size="12" fill="#7C98B6">3 e-mails sur 2 semaines</text>

  <line x1="175" y1="999" x2="175" y2="1023" stroke="#99ACC2" stroke-width="2"/>

  <circle cx="175" cy="1040" r="16" fill="#7C98B6"/>
  <circle cx="175" cy="1040" r="8.5" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 175,1035 v 5.5 h 4.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="175" y1="1056" x2="175" y2="1080" stroke="#99ACC2" stroke-width="2"/>

  <rect x="20" y="1080" width="310" height="64" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="175" y="1108" text-anchor="middle" font-size="14" font-weight="700" fill="#33475B">Retarder l'action suivante</text>
  <text x="175" y="1130" text-anchor="middle" font-size="12" fill="#7C98B6">7 jours, puis revérifier le score</text>

  <!-- Loop back to branch -->
  <path d="M 20,1112 C -50,1112 -50,631 168,631" fill="none" stroke="#99ACC2" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-fr)"/>

  <!-- ============ Right branch (YES): sales handoff ============ -->
  <line x1="525" y1="832" x2="525" y2="858" stroke="#99ACC2" stroke-width="2"/>

  <circle cx="525" cy="875" r="16" fill="#00A4BD"/>
  <path d="M 519,867 v 16 M 519,868 h 9 l -2.5,4 l 2.5,4 h -9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="525" y1="891" x2="525" y2="915" stroke="#99ACC2" stroke-width="2"/>

  <rect x="370" y="915" width="310" height="84" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="525" y="943" text-anchor="middle" font-size="14" font-weight="700" fill="#33475B">Définir une propriété</text>
  <text x="525" y="964" text-anchor="middle" font-size="12" fill="#7C98B6">Étape du cycle de vie sur</text>
  <text x="525" y="982" text-anchor="middle" font-size="12" fill="#7C98B6">« Sales Qualified Lead »</text>

  <line x1="525" y1="999" x2="525" y2="1023" stroke="#99ACC2" stroke-width="2"/>

  <circle cx="525" cy="1040" r="16" fill="#00A4BD"/>
  <path d="M 519,1041 l 4,4 l 9,-9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="525" y1="1056" x2="525" y2="1080" stroke="#99ACC2" stroke-width="2"/>

  <rect x="370" y="1080" width="310" height="84" rx="4" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.3"/>
  <text x="525" y="1108" text-anchor="middle" font-size="14" font-weight="700" fill="#33475B">Créer une tâche</text>
  <text x="525" y="1130" text-anchor="middle" font-size="12" fill="#7C98B6">Notifier le commercial — sous 24h</text>
  <text x="525" y="1148" text-anchor="middle" font-size="12" fill="#7C98B6">(SLA de suivi)</text>

  <!-- Footer -->
  <text x="350" y="1230" text-anchor="middle" font-size="12" fill="#99ACC2">Exemple illustratif — inspiré de l'interface HubSpot Workflows</text>
</svg>
