<svg viewBox="0 0 900 1360" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="900" height="1360" fill="#F7F8FA"/>

  <!-- Header -->
  <text x="60" y="64" font-size="13" font-weight="700" letter-spacing="2" fill="#6B7684">INFOGRAPHIE STRATÉGIQUE</text>
  <text x="60" y="106" font-size="30" font-weight="700" fill="#16202E">Être Cité par les Moteurs IA (GEO)</text>
  <text x="60" y="136" font-size="15" fill="#5B6572">Comment les marques B2B obtiennent des citations dans ChatGPT,</text>
  <text x="60" y="158" font-size="15" fill="#5B6572">Perplexity, Gemini et Google AI Overviews</text>

  <line x1="60" y1="182" x2="840" y2="182" stroke="#E1E5EA" stroke-width="1.5"/>

  <!-- Hero stat card -->
  <rect x="62" y="203" width="778" height="8" rx="4" fill="#D7DEEA" opacity="0.5"/>
  <rect x="60" y="200" width="780" height="132" rx="14" fill="#E6ECF5"/>
  <text x="100" y="290" font-size="62" font-weight="800" fill="#1B3A6B">73%</text>
  <text x="284" y="248" font-size="16" font-weight="700" fill="#16202E">des acheteurs B2B utilisent désormais des outils IA</text>
  <text x="284" y="270" font-size="16" font-weight="700" fill="#16202E">comme ChatGPT et Perplexity pour évaluer des</text>
  <text x="284" y="292" font-size="16" font-weight="700" fill="#16202E">fournisseurs — souvent avant même de visiter un site.</text>
  <text x="284" y="315" font-size="11.5" font-style="italic" fill="#5B6572">Source : Averi — B2B SaaS AI Citation Benchmarks, 2026</text>

  <!-- Gap stat card -->
  <rect x="62" y="360" width="778" height="8" rx="4" fill="#EAD9B8" opacity="0.4"/>
  <rect x="60" y="357" width="780" height="108" rx="14" fill="#FBF1DF"/>
  <circle cx="102" cy="411" r="22" fill="#C77F1A"/>
  <line x1="102" y1="400" x2="102" y2="412" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <circle cx="102" cy="420" r="1.8" fill="#FFFFFF"/>
  <text x="146" y="401" font-size="17" font-weight="700" fill="#16202E">51% des marques B2B tech ne sont citées nulle part</text>
  <text x="146" y="424" font-size="14" fill="#5B6572">dans ChatGPT, Perplexity ou Gemini — la plupart des concurrents</text>
  <text x="146" y="444" font-size="14" fill="#5B6572">sont tout simplement invisibles dans les réponses IA.</text>
  <text x="700" y="453" font-size="11" font-style="italic" fill="#5B6572" text-anchor="end">Source : Averi, 2026</text>

  <!-- Strategy section label -->
  <text x="60" y="512" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6B7684">// STRATÉGIE EN 5 ÉTAPES POUR ÊTRE CITÉ</text>
  <line x1="60" y1="528" x2="840" y2="528" stroke="#E1E5EA" stroke-width="1.5"/>

  <!-- Card 1: Answer first (target icon) -->
  <rect x="61" y="549" width="778" height="4" rx="2" fill="#000000" opacity="0.03"/>
  <rect x="60" y="546" width="780" height="104" rx="12" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="1"/>
  <circle cx="102" cy="598" r="22" fill="#1B3A6B"/>
  <circle cx="102" cy="598" r="13" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="102" cy="598" r="7.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="102" cy="598" r="2.5" fill="#FFFFFF"/>
  <text x="146" y="588" font-size="17" font-weight="700" fill="#16202E">Répondez directement dès la première phrase</text>
  <text x="146" y="611" font-size="13.5" fill="#5B6572">Donnez la conclusion dans les deux premières phrases, puis expliquez —</text>
  <text x="146" y="630" font-size="13.5" fill="#5B6572">les moteurs IA extraient des réponses courtes — pas noyées au troisième paragraphe.</text>

  <!-- Card 2: Specific & sourced (percent icon) -->
  <rect x="61" y="663" width="778" height="4" rx="2" fill="#000000" opacity="0.03"/>
  <rect x="60" y="660" width="780" height="104" rx="12" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="1"/>
  <circle cx="102" cy="712" r="22" fill="#1B3A6B"/>
  <text x="102" y="719" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">%</text>
  <text x="146" y="702" font-size="17" font-weight="700" fill="#16202E">Rendez chaque affirmation précise et sourcée</text>
  <text x="146" y="725" font-size="13.5" fill="#5B6572">Chiffres exacts, études nommées et dates sont cités. Les formulations vagues comme</text>
  <text x="146" y="744" font-size="13.5" fill="#5B6572">« de nombreux clients... » sont filtrées avant toute citation.</text>

  <!-- Card 3: Structure for extraction (document/lines icon) -->
  <rect x="61" y="777" width="778" height="4" rx="2" fill="#000000" opacity="0.03"/>
  <rect x="60" y="774" width="780" height="104" rx="12" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="1"/>
  <circle cx="102" cy="826" r="22" fill="#1B3A6B"/>
  <line x1="93" y1="818" x2="111" y2="818" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="93" y1="826" x2="107" y2="826" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="93" y1="834" x2="111" y2="834" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="146" y="816" font-size="17" font-weight="700" fill="#16202E">Structurez vos pages pour l'extraction, pas que la lecture</text>
  <text x="146" y="839" font-size="13.5" fill="#5B6572">Vraies questions en H2, schema FAQ, tableaux comparatifs — lors d'un test</text>
  <text x="146" y="858" font-size="13.5" fill="#5B6572">Search Engine Land de sept. 2025, le schema a seul déterminé quelle page était citée.</text>

  <!-- Card 4: Consistency (network nodes icon) -->
  <rect x="61" y="891" width="778" height="4" rx="2" fill="#000000" opacity="0.03"/>
  <rect x="60" y="888" width="780" height="104" rx="12" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="1"/>
  <circle cx="102" cy="940" r="22" fill="#1B3A6B"/>
  <line x1="94" y1="945" x2="102" y2="931" stroke="#FFFFFF" stroke-width="1.6"/>
  <line x1="110" y1="945" x2="102" y2="931" stroke="#FFFFFF" stroke-width="1.6"/>
  <line x1="94" y1="945" x2="110" y2="945" stroke="#FFFFFF" stroke-width="1.6"/>
  <circle cx="102" cy="931" r="3" fill="#FFFFFF"/>
  <circle cx="94" cy="945" r="3" fill="#FFFFFF"/>
  <circle cx="110" cy="945" r="3" fill="#FFFFFF"/>
  <text x="146" y="930" font-size="17" font-weight="700" fill="#16202E">Gardez des informations identiques sur tous les canaux</text>
  <text x="146" y="953" font-size="13.5" fill="#5B6572">Même positionnement, chiffres et affirmations sur le site, LinkedIn,</text>
  <text x="146" y="972" font-size="13.5" fill="#5B6572">annuaires et presse — les IA vérifient la cohérence avant d'accorder leur confiance.</text>

  <!-- Card 5: Third-party authority (external link icon) -->
  <rect x="61" y="1005" width="778" height="4" rx="2" fill="#000000" opacity="0.03"/>
  <rect x="60" y="1002" width="780" height="104" rx="12" fill="#FFFFFF" stroke="#E1E5EA" stroke-width="1"/>
  <circle cx="102" cy="1054" r="22" fill="#1B3A6B"/>
  <rect x="93" y="1049" width="12" height="12" rx="1.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 101 1045 L 111 1045 L 111 1055" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="111" y1="1045" x2="101" y2="1055" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="146" y="1044" font-size="17" font-weight="700" fill="#16202E">Gagnez des citations que vous ne contrôlez pas</text>
  <text x="146" y="1067" font-size="13.5" fill="#5B6572">Relations presse, mentions d'analystes et couverture tierce crédible construisent</text>
  <text x="146" y="1086" font-size="13.5" fill="#5B6572">les signaux d'autorité externes que le GEO valorise plus que la densité de mots-clés.</text>

  <!-- Bottom stat strip -->
  <rect x="60" y="1132" width="240" height="120" rx="12" fill="#E6ECF5"/>
  <text x="180" y="1180" text-anchor="middle" font-size="32" font-weight="800" fill="#1B3A6B">4–5×</text>
  <text x="180" y="1202" text-anchor="middle" font-size="12.5" fill="#16202E">Conversion des visiteurs venant</text>
  <text x="180" y="1218" text-anchor="middle" font-size="12.5" fill="#16202E">de l'IA vs. recherche Google</text>
  <text x="180" y="1240" text-anchor="middle" font-size="10" font-style="italic" fill="#5B6572">First-Stop Study, 2026</text>

  <rect x="330" y="1132" width="240" height="120" rx="12" fill="#E6ECF5"/>
  <text x="450" y="1180" text-anchor="middle" font-size="32" font-weight="800" fill="#1B3A6B">83%</text>
  <text x="450" y="1202" text-anchor="middle" font-size="12.5" fill="#16202E">se sentent plus confiants dans</text>
  <text x="450" y="1218" text-anchor="middle" font-size="12.5" fill="#16202E">leur choix quand l'IA était impliquée</text>
  <text x="450" y="1240" text-anchor="middle" font-size="10" font-style="italic" fill="#5B6572">First-Stop Study, 2026</text>

  <rect x="600" y="1132" width="240" height="120" rx="12" fill="#E6ECF5"/>
  <text x="720" y="1180" text-anchor="middle" font-size="32" font-weight="800" fill="#1B3A6B">+35%</text>
  <text x="720" y="1202" text-anchor="middle" font-size="12.5" fill="#16202E">de clics organiques en plus si</text>
  <text x="720" y="1218" text-anchor="middle" font-size="12.5" fill="#16202E">citée dans Google AI Overviews</text>
  <text x="720" y="1240" text-anchor="middle" font-size="10" font-style="italic" fill="#5B6572">Averi, 2026</text>

  <line x1="60" y1="1276" x2="840" y2="1276" stroke="#E1E5EA" stroke-width="1.5"/>
  <text x="60" y="1298" font-size="12.5" font-weight="700" fill="#16202E">Suivez-le chaque mois — reposez les questions de vos acheteurs à ChatGPT, Perplexity &amp; AI Overviews.</text>
  <text x="60" y="1320" font-size="11" fill="#5B6572">Sources : 5W PR — The First-Stop Study (2026) &#183; Averi — B2B SaaS AI Citation Benchmarks (2026)</text>
  <text x="60" y="1338" font-size="11" fill="#5B6572">Search Engine Land (sept. 2025). Infographie stratégique originale — pas les résultats d'un client en particulier.</text>
</svg>
